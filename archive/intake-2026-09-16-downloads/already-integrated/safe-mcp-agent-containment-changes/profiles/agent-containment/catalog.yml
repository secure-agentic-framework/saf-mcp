requirements:
- id: ACP-R001
  group: isolation
  title: Independent enforcement
  requirement: The deployment MUST enforce isolation outside the agent-controlled runtime; the agent MUST
    NOT administer the host, broker, hypervisor, or their credentials.
  mitigations:
  - SAF-M-75
  test_id: ACP-V001
  validation:
    status: planned
    procedure: Attempt a denied host-management operation from the runtime and a tool process.
    expected: The operation is denied; independent host evidence identifies the caller and unchanged control
      state.
- id: ACP-R002
  group: isolation
  title: Broker-only external effects
  requirement: All agent-caused network, file-sharing, messaging, and service effects MUST pass through
    the broker. Direct outbound connections MUST be denied.
  mitigations:
  - SAF-M-75
  test_id: ACP-V002
  validation:
    status: planned
    procedure: Try direct outbound access and then the same registered operation through the broker.
    expected: Direct access is blocked; the authorized broker operation alone produces an external receipt.
- id: ACP-R003
  group: isolation
  title: Descendant inheritance
  requirement: Child processes, nested runtimes, delegated workers, and subsidiary agents MUST inherit
    an equal or narrower ceiling and MUST NOT acquire ambient host capabilities.
  mitigations:
  - SAF-M-75
  test_id: ACP-V003
  validation:
    status: planned
    procedure: Spawn a harmless child and delegated worker, then request a capability absent from the
      parent.
    expected: The child and worker are denied; parent-child identities and effective scopes are recorded.
- id: ACP-R004
  group: isolation
  title: Complete channel inventory
  requirement: The boundary inventory MUST include DNS, inherited sockets, IPC, mounts, clipboard, display,
    devices, telemetry, updates, crash reports, and remote model inference.
  mitigations:
  - SAF-M-75
  test_id: ACP-V004
  validation:
    status: planned
    procedure: Exercise each inventoried channel with an inert marker and inspect independent egress and
      host records.
    expected: Only explicitly authorized channels carry the marker; unknown channels block deployment
      acceptance.
- id: ACP-R005
  group: broker
  title: Typed requests
  requirement: The broker MUST accept schema-validated operations on registered resources; agent text
    MUST NOT become arbitrary broker code, shell commands, or open-ended forwarding instructions.
  mitigations:
  - SAF-M-79
  test_id: ACP-V005
  validation:
    status: planned
    procedure: Submit an unknown operation, extra executable fields, and a valid registered read.
    expected: Malformed and unregistered requests are denied; the registered read succeeds within scope.
- id: ACP-R006
  group: broker
  title: Broker-owned service credentials
  requirement: External service credentials MUST remain outside the runtime, prompts, tool results, environment
    variables, shared files, and diagnostic output.
  mitigations:
  - SAF-M-79
  test_id: ACP-V006
  validation:
    status: planned
    procedure: Inspect runtime-visible state using synthetic credentials provisioned only to the broker.
    expected: No synthetic credential appears; the broker can still complete the authorized service request.
- id: ACP-R007
  group: broker
  title: Destination and operation binding
  requirement: The broker MUST bind service, resource, method, recipient, and resolved destination; redirects,
    address changes, and metadata or loopback access require explicit authorization.
  mitigations:
  - SAF-M-79
  test_id: ACP-V007
  validation:
    status: planned
    procedure: Resolve a registered test resource, then change its recipient or redirect it to an unapproved
      local sink.
    expected: The changed destination is denied before sending request contents; a legitimate unchanged
      destination remains usable.
- id: ACP-R008
  group: broker
  title: Explicit disclosure boundary
  requirement: Every outgoing argument, generated file, report, browser render, and message MUST have
    an authorized recipient, permitted content scope, and release decision. Arbitrary output MUST NOT
    be described as zero leakage.
  mitigations:
  - SAF-M-79
  test_id: ACP-V008
  validation:
    status: planned
    procedure: Place an inert confidential marker in a report, tool argument, and image request targeting
      an unapproved test recipient.
    expected: No unauthorized recipient receives the marker; the approved report records exactly what
      was released.
- id: ACP-R009
  group: broker
  title: Minimum input access
  requirement: The broker MUST minimize records, fields, and task context supplied to the agent and MUST
    treat remote inference as a disclosure to the model provider.
  mitigations:
  - SAF-M-79
  test_id: ACP-V009
  validation:
    status: planned
    procedure: Request a full dataset and an outside inference call for a task requiring one local record.
    expected: Only the permitted record is supplied; external inference requires its own permitted destination
      and disclosure decision.
- id: ACP-R010
  group: owner-approval
  title: Binding enrollment
  requirement: Enrollment MUST bind an established owner identity to the agent, protected approval mechanism,
    verifier identity, credential reference, and current policy version.
  mitigations:
  - SAF-M-76
  test_id: ACP-V010
  validation:
    status: planned
    procedure: Substitute another enrollment or verifier while retaining the displayed owner name.
    expected: The binding check fails and the protected operation remains unexecuted.
- id: ACP-R011
  group: owner-approval
  title: Protected display and input
  requirement: The owner interaction MUST use a path the agent cannot render over, read, keylog, screen-capture,
    or control through accessibility or automation interfaces.
  mitigations:
  - SAF-M-76
  test_id: ACP-V011
  validation:
    status: planned
    procedure: Run an inert fake approval form and attempt synthetic-input capture from the confined runtime.
    expected: The fake form grants no authority; the genuine private input and display data are absent
      from agent-visible channels.
- id: ACP-R012
  group: owner-approval
  title: Exact-action approval
  requirement: The protected display MUST show the relying service, operation, resource, material parameters,
    recipient, session, expiry, and policy change, and approval MUST bind those immutable values.
  mitigations:
  - SAF-M-76
  test_id: ACP-V012
  validation:
    status: planned
    procedure: Approve a benign request, then change one bound field before dispatch.
    expected: Each changed request is rejected; the unchanged approved request remains eligible exactly
      once.
- id: ACP-R013
  group: owner-approval
  title: Exclusive approval attribution
  requirement: Only the designated protected mechanism MAY produce owner-attributable approval. Agent-authored
    flags, simulated clicks, model text, and ordinary tool responses MUST NOT substitute for it.
  mitigations:
  - SAF-M-76
  test_id: ACP-V013
  validation:
    status: planned
    procedure: Supply an agent-authored approved=true flag or a forged completion message.
    expected: No authorization is created; an actual protected owner approval is separately attributable.
- id: ACP-R014
  group: one-use
  title: Event allocation
  requirement: Each approval attempt MUST have a unique full event identifier bound to its tenant, enrollment,
    agent, verifier, request, session, policy, expiry, and private resource allocation.
  mitigations:
  - SAF-M-77
  test_id: ACP-V014
  validation:
    status: planned
    procedure: Allocate parallel events with colliding short display labels and attempt cross-tenant substitution.
    expected: Full identifiers remain distinct; tenant and context mismatches are denied.
- id: ACP-R015
  group: one-use
  title: Atomic attempt consumption
  requirement: After transport authentication and event-routing checks, the verifier MUST atomically claim
    one eligible attempt before substantive witness validation; accept, reject, or abort MUST NOT reopen
    that attempt.
  mitigations:
  - SAF-M-77
  test_id: ACP-V015
  validation:
    status: planned
    procedure: Send concurrent submissions for one eligible event to separate verifier instances.
    expected: At most one submission enters substantive verification; invalid proof also consumes that
      claimed attempt.
- id: ACP-R016
  group: one-use
  title: Conservative crash recovery
  requirement: Expiry, abort, and uncertain recovery MUST retire the event and any allocated private masks.
    Replica restoration MUST NOT make a consumed allocation available again.
  mitigations:
  - SAF-M-77
  test_id: ACP-V016
  validation:
    status: planned
    procedure: Interrupt processing around allocation, claim, and result recording, then restore a replica.
    expected: Uncertain or consumed events stay ineligible; a fresh event uses a distinct resource allocation.
- id: ACP-R017
  group: one-use
  title: Authenticated verifier result
  requirement: The controller MUST authenticate the verifier result and its complete context, including
    issuer, audience, agent, enrollment, policy, event, request, result, and expiry. A public success
    bit MUST NOT authorize an action.
  mitigations:
  - SAF-M-77
  test_id: ACP-V017
  validation:
    status: planned
    procedure: Alter the issuer, audience, action context, expiry, or result of an inert verifier message.
    expected: Every alteration is denied before dispatch; valid current context is accepted only by its
      intended controller.
- id: ACP-R018
  group: one-use
  title: Single execution
  requirement: The controller MUST maintain durable execution state distinct from verification state and
    use downstream idempotency or reconciliation before retrying an uncertain external action.
  mitigations:
  - SAF-M-77
  test_id: ACP-V018
  validation:
    status: planned
    procedure: Deliver an accepted verdict twice and interrupt the controller after the first external
      effect.
    expected: The effect occurs at most once, or remains blocked pending reconciliation; a retry never
      guesses that execution failed.
- id: ACP-R019
  group: lifecycle
  title: Protected policy changes
  requirement: A policy version MUST be immutable once approved. Replacing it MUST require a new owner-authorized
    event bound to the old and proposed versions; the agent may propose but not install changes.
  mitigations:
  - SAF-M-78
  test_id: ACP-V019
  validation:
    status: planned
    procedure: Use a tool, direct file write, and broker request to expand egress permission.
    expected: Each path is denied without the protected version-specific approval; a properly approved
      successor is auditable.
- id: ACP-R020
  group: lifecycle
  title: Revocation and rollback resistance
  requirement: The controller MUST reject revoked owners, agents, delegations, enrollments, and superseded
    policy versions, including after restart and replica recovery.
  mitigations:
  - SAF-M-78
  test_id: ACP-V020
  validation:
    status: planned
    procedure: Replay a valid historical grant after revocation and restore an old policy snapshot.
    expected: Historical authority remains invalid; independent state identifies the current accepted
      epoch.
- id: ACP-R021
  group: lifecycle
  title: Updates and recovery
  requirement: Updates, administrative recovery, emergency access, and verifier replacement MUST preserve
    owner approval and containment; a software digest alone MUST NOT count as execution attestation.
  mitigations:
  - SAF-M-78
  test_id: ACP-V021
  validation:
    status: planned
    procedure: Attempt recovery or a downgraded update using runtime-held credentials and an unapproved
      binary with a published digest.
    expected: Neither creates authority; approved maintenance preserves the running policy binding and
      leaves a reviewable record.
- id: ACP-R022
  group: operations
  title: Independent stop
  requirement: Authorized operators MUST be able to pause execution and revoke external authority through
    a path unavailable to the agent.
  mitigations:
  - SAF-M-81
  test_id: ACP-V022
  validation:
    status: planned
    procedure: Suspend an agent that continues submitting requests from active children.
    expected: New external effects stop across the execution tree while audit and recovery access remain
      available to operators.
- id: ACP-R023
  group: delegation
  title: Distinct machine identity
  requirement: Agent actions MUST identify the agent and its delegating owner separately; routine machine
    requests MUST NOT be recorded as fresh personal owner approvals.
  mitigations:
  - SAF-M-80
  test_id: ACP-V023
  validation:
    status: planned
    procedure: Perform the same allowed action by the owner directly and by an authorized agent.
    expected: Service and broker records distinguish both principals and identify the delegation used.
- id: ACP-R024
  group: delegation
  title: Scoped and expiring delegation
  requirement: Delegations MUST bind the owner, agent, audience, permitted operation and resources, policy
    version, expiry, and revocation state; they MUST exclude owner-policy-change authority.
  mitigations:
  - SAF-M-80
  test_id: ACP-V024
  validation:
    status: planned
    procedure: Reuse an ordinary task delegation to alter policy or access another service after expiry.
    expected: Both attempts are denied; a current in-scope task remains allowed.
- id: ACP-R025
  group: delegation
  title: Receiver-enforced binding
  requirement: Every downstream hop MUST validate the initiating principal, resource, and delegated scope;
    forwarding an accepted proof or credential MUST NOT transfer owner authority to another session or
    audience.
  mitigations:
  - SAF-M-80
  test_id: ACP-V025
  validation:
    status: planned
    procedure: Forward a current request or proof through an unapproved proxy or to another relying service.
    expected: The new hop or context cannot authorize the substituted action, even when the credential
      remains secret.
- id: ACP-R026
  group: delegation
  title: Subdelegation ceiling
  requirement: An agent-created worker MUST receive an equal or smaller authority set, never the owner
    approval capability; its lineage and revocation dependency MUST be recorded.
  mitigations:
  - SAF-M-80
  test_id: ACP-V026
  validation:
    status: planned
    procedure: Request a child delegation with one extra resource and revoke the parent during a child
      task.
    expected: Expansion is rejected and the child loses external authority when the parent delegation
      is revoked.
- id: ACP-R027
  group: operations
  title: Independent audit
  requirement: The audit service MUST record allocation, claim, validation, authorization, execution,
    denial, revocation, and policy changes outside agent control while excluding secrets and unnecessary
    personal data.
  mitigations:
  - SAF-M-81
  test_id: ACP-V027
  validation:
    status: planned
    procedure: Try to erase or forge an audit event from the runtime and inspect logs for synthetic private
      material.
    expected: Forgery or deletion is rejected or independently detectable; secret values are absent from
      retained records.
- id: ACP-R028
  group: operations
  title: Budgets and fail-closed behavior
  requirement: Attempts, concurrency, compute, sampling, output, and retries MUST have enforceable budgets.
    Failure of approval, ledger, clock policy, or audit dependencies MUST NOT create new external permission.
  mitigations:
  - SAF-M-81
  test_id: ACP-V028
  validation:
    status: planned
    procedure: Exhaust attempt capacity and interrupt a controller dependency while requesting a new external
      action.
    expected: The action is denied or safely deferred; bounded fresh recovery is possible without reopening
      consumed events.
- id: ACP-R029
  group: operations
  title: Side-channel scope
  requirement: The threat model MUST inventory relevant timing, length, error, feedback, shared-resource,
    sensor, and physical channels; it MUST distinguish evaluated channels from unmeasured ones.
  mitigations:
  - SAF-M-81
  test_id: ACP-V029
  validation:
    status: planned
    procedure: Measure the complete declared observer trace for synthetic credential classes and review
      unmeasured physical access.
    expected: The evidence states measured coverage and residual channels; missing evidence cannot be
      reported as universal noninterference.
- id: ACP-R030
  group: lifecycle
  title: Governed ownership and recovery
  requirement: Ownership transfer and recovery MUST require designated organizational authority, revoke
    replaced bindings, and support a documented human fallback without general agent bypass.
  mitigations:
  - SAF-M-78
  test_id: ACP-V030
  validation:
    status: planned
    procedure: Replace a departed administrator and attempt access with the former enrollment and an emergency
      agent flag.
    expected: Old authority and agent-authored emergency flags are rejected; the approved successor remains
      identifiable.
- id: ACP-R031
  group: proof-privacy
  title: Fresh private masking resources
  requirement: An implementation claiming the supplied ENI6MA ideal transcript property MUST use the specified
    fresh independent secret masks without reusing allocations; a public nonce is not a secret mask.
  mitigations:
  - SAF-M-82
  test_id: ACP-V031
  validation:
    status: planned
    procedure: Audit allocation across successful, rejected, aborted, and restored events using synthetic
      mask identifiers.
    expected: Every required position has a fresh allocation and retired allocations cannot return; this
      inventory alone is not proof of randomness quality.
- id: ACP-R032
  group: proof-privacy
  title: Complete observation declaration
  requirement: The privacy claim MUST name all information visible to the agent, including challenges,
    responses, timing, errors, acceptance feedback, recovery, and correlated sensors.
  mitigations:
  - SAF-M-82
  test_id: ACP-V032
  validation:
    status: planned
    procedure: Compare the implemented logging and sensor inventory against the declared privacy experiment.
    expected: Any additional observable requires analysis or exclusion from the claim; honest-session
      privacy cannot silently cover an active guessing oracle.
- id: ACP-R033
  group: proof-privacy
  title: Protected verification state
  requirement: Private naming maps, legends, raw inputs, masks, enrolled references, and reconstructed
    credentials MUST remain outside agent-controlled memory, tools, logs, and interfaces.
  mitigations:
  - SAF-M-82
  test_id: ACP-V033
  validation:
    status: planned
    procedure: Attempt synthetic secret reads from each runtime-visible storage and debug surface.
    expected: No private verifier or approval value becomes visible; the intended verifier retains only
      its authorized processing access.
- id: ACP-R034
  group: proof-privacy
  title: Separate security properties
  requirement: Deployment claims MUST distinguish transcript privacy, knowledge verification, enrolled
    identity attribution, action authorization, result authenticity, replay resistance, and runtime confinement.
  mitigations:
  - SAF-M-82
  test_id: ACP-V034
  validation:
    status: planned
    procedure: Review the claim-to-evidence matrix and attempt a live relay without recovering any credential.
    expected: Privacy is not treated as a relay or isolation proof; each required property has its own
      conditions and evaluation record.
