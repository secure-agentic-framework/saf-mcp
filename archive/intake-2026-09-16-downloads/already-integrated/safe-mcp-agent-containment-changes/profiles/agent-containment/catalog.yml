schema_version: 1
profile_id: ACP
title: Agent Containment and Owner Authorization
status: proposal
reviewed_on: '2026-09-16'
base_commit: d3d40297c478d2680d315399b6aaf317e5aa15b8
scope: Deployment requirements and inert assessment procedures spanning existing SAF profiles; not a new
  canonical technique namespace or an implementation of a secure runtime.
validation_scope: Repository consistency only. Deployment acceptance tests are planned and have not been
  executed against a runtime.
groups:
- id: isolation
  name: Runtime isolation and complete mediation
  mitigation: SAF-M-75
  category: Isolation and Containment
  control_name: Broker-Only Egress and Descendant Containment
  description: Place the model runtime, tools, interpreters, browser processes, and descendants inside
    an enforcement boundary they cannot administer. Only the external broker may initiate approved external
    effects.
  distinction: SAF-M-74 constrains individual invocations. This control additionally removes ambient communication
    from the whole agent execution tree and separates the broker from that tree.
  limitations: Host or hypervisor compromise can defeat the boundary. A disconnected virtual network does
    not account for inherited sockets, shared folders, peripherals, or a remote inference provider.
- id: broker
  name: Broker requests and information release
  mitigation: SAF-M-79
  category: Data Security
  control_name: Disclosure-Bounded Tool Brokering
  description: Represent requests as constrained operations on registered resources. The broker resolves
    destinations, retains service credentials, and separately authorizes every information release.
  distinction: SAF-M-72 inspects outputs for data loss. This control constrains input selection, request
    destinations, arguments, response recipients, and permitted disclosure before relying on content inspection.
  limitations: Arbitrary agent-controlled output to an outside recipient remains a communication channel.
    Content classification alone cannot establish zero leakage.
- id: owner-approval
  name: Owner identity and protected approval
  mitigation: SAF-M-76
  category: UI Security
  control_name: Protected Owner Approval Path
  description: Accept owner approval only from a protected interaction that the agent cannot render, observe,
    automate, or alter. Bind the displayed decision to the action ultimately dispatched.
  distinction: SAF-M-69 establishes out-of-band privileged authorization. This control specifies the independent
    input/display boundary and exclusive owner attribution needed against an agent that can control its
    ordinary workspace.
  limitations: A compromised approval device or a person knowingly approving a harmful action remains
    outside the guarantee. Recognition of enrolled authority does not independently establish civil identity.
- id: one-use
  name: One-use approval and authenticated results
  mitigation: SAF-M-77
  category: Cryptographic Control
  control_name: Durable Single-Use Action Authorization
  description: Bind every protected approval to one immutable request context, consume its attempt atomically,
    authenticate any remote verdict, and prevent duplicate external effects across retries and crashes.
  distinction: SAF-M-31 provides proof-of-possession token guidance and SAF-M-69 binds privileged approvals.
    This control adds durable attempt consumption and a separate execution receipt across multiple enforcement
    instances.
  limitations: Single-use verification does not automatically imply single execution. An external service
    without idempotency or reconciliation may leave an uncertain outcome after a crash; do not blindly
    retry.
- id: lifecycle
  name: Policy, enrollment, and recovery lifecycle
  mitigation: SAF-M-78
  category: Preventive Control
  control_name: Enrollment and Policy Lifecycle Integrity
  description: Bind the owner, agent, verifier, enrollment, policy, and running enforcement version. Permit
    version replacement, recovery, and ownership changes only through the authorized administrative path.
  distinction: SAF-M-45 covers tool manifests and attestation. This control governs the owner-to-enrollment
    relationship and every route capable of changing the policy or verifier, including recovery and rollback.
  limitations: A published hash identifies bytes, not the behavior of a running machine. An append-only
    ledger does not establish honest execution, safe policy, or immediate consensus.
- id: delegation
  name: Agent identity and bounded delegation
  mitigation: SAF-M-80
  category: Architectural Control
  control_name: Owner-Separated Agent Delegation
  description: Give the agent a distinct identity and a revocable, audience-bound delegation. Downstream
    services retain the initiating principal and task boundary; delegation never includes the ability
    to approve expansion of its own authority.
  distinction: SAF-M-16 limits token scopes. This control also preserves the difference between an owner
    and a delegated agent throughout subdelegation, logging, and policy changes.
  limitations: A correctly authorized delegation may still permit harmful conduct within its scope. A
    copied bearer credential remains usable unless the recipient enforces its binding and revocation conditions.
- id: operations
  name: Independent audit, shutdown, and recovery
  mitigation: SAF-M-81
  category: Architectural Control
  control_name: Fail-Closed Containment Operations
  description: Maintain an independent shutdown path, protected audit records, resource budgets, and conservative
    recovery. Security service interruption must not grant new external access.
  distinction: SAF-M-12 supplies audit logging and SAF-M-73 caps sampling. This control ties audit, availability,
    attempt exhaustion, and operator recovery to the containment boundary.
  limitations: Availability can be reduced by conservative denial. Essential workflows need a human fallback
    that preserves authorization rather than a general bypass.
- id: proof-privacy
  name: Approval secrets and observation boundaries
  mitigation: SAF-M-82
  category: Cryptographic Control
  control_name: Protected Approval Secret Handling
  description: Keep private approval inputs, decoding references, and any secret randomization outside
    the agent observation boundary. State the exact privacy property and the resources on which it depends.
  distinction: SAF-M-69 addresses authorization. This control separately addresses what observing the
    approval exchange reveals, without equating transcript privacy with authorization or machine isolation.
  limitations: No privacy theorem repairs a secret captured before protection. Fresh secret randomness,
    where required, must actually be provisioned; public nonces and deterministic seed expansion do not
    supply unlimited independent secret entropy.
