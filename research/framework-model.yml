- technique_id: SAF-T1707
  name: CSRF Token Relay
  lifecycle_status: active
  documentation_status: stable
  evidence_status: research-derived
  profiles:
  - mcp
  tactics:
  - ATK-TA0008
  summary: '- **In scope**: - A valid, attacker-obtained `state` value is accepted from a different browser or session,
    and the callback completes an attacker-originated authorization flow or misbinds an account. - Weak client-side
    binding, including a cookie an attacker-controlled sibling origin can plant, permits the relayed state and callback
    context to match. - **Out of scope**: - Callbacks that omit or fail to validate `state`; those are ordinary
    OAuth CSRF rather than relay of a valid anti-CSRF token. - Authorization-code interception or injection where
    PKCE or issuer binding is the defining failed boundary. - Bearer-token theft, token passthrough, open redirects,
    phishing, and downstream actions after authentication.'
