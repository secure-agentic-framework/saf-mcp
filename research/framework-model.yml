version: 2
framework:
  name: Secure Agentic Framework
  short_name: SAF
  canonical_catalog: research/framework-model.yml
  scope_model: profile_based
  technique_ids_are_opaque: true
statuses:
  lifecycle:
  - active
  - deprecated
  documentation:
  - draft
  - under_review
  - stable
  - deprecated
  evidence:
  - observed
  - demonstrated
  - research-derived
  - hypothesized
detection_validation_levels:
- proposed
- syntax_validated
- fixture_tested
- telemetry_replay_tested
- field_evaluated
release_gates:
- evidence
- taxonomy
- operational
profiles:
- id: core
  name: SAF Core
  description: Mechanisms that materially depend on model-mediated decisions, delegated action, dynamic context,
    memory, or agent coordination.
- id: mcp
  name: MCP Profile
  description: Mechanisms expressed through Model Context Protocol hosts, clients, servers, tools, resources, prompts,
    sampling, authorization, or transports.
- id: code-agent
  name: Code-Agent Profile
  description: Mechanisms specific to coding assistants, developer workstations, repositories, build systems, shells,
    and file-oriented agents.
- id: rag-memory
  name: RAG and Memory Profile
  description: Mechanisms involving retrieval indexes, embeddings, persistent context, shared memory, or retrieval-augmented
    generation.
- id: financial-agent
  name: Financial-Agent Profile
  description: Mechanisms involving delegated payment, trading, blockchain, or other financial authority.
- id: model-lifecycle
  name: Model-Lifecycle Profile
  description: Mechanisms involving training, adaptation, evaluation, registration, promotion, or deployment of
    model artifacts.
tactics:
- id: ATK-TA0043
  name: Reconnaissance
  description: The adversary is gathering information to plan future agentic operations.
- id: ATK-TA0042
  name: Resource Development
  description: The adversary is establishing resources to support agentic operations.
- id: ATK-TA0001
  name: Initial Access
  description: The adversary is trying to enter an agentic environment.
- id: ATK-TA0002
  name: Execution
  description: The adversary is trying to cause code, tools, or model-mediated actions to run.
- id: ATK-TA0003
  name: Persistence
  description: The adversary is trying to retain influence or access across agent sessions or restarts.
- id: ATK-TA0004
  name: Privilege Escalation
  description: The adversary is trying to exercise authority beyond the initiating principal or task.
- id: ATK-TA0005
  name: Defense Evasion
  description: The adversary is trying to avoid prevention, review, or detection.
- id: ATK-TA0006
  name: Credential Access
  description: The adversary is trying to obtain authentication material or delegated authority.
- id: ATK-TA0007
  name: Discovery
  description: The adversary is trying to understand an agentic environment after gaining access.
- id: ATK-TA0008
  name: Lateral Movement
  description: The adversary is trying to move between tools, agents, services, or trust domains.
- id: ATK-TA0009
  name: Collection
  description: The adversary is gathering data of interest through an agentic system.
- id: ATK-TA0011
  name: Command and Control
  description: The adversary is maintaining a control or feedback path through an agentic system.
- id: ATK-TA0010
  name: Exfiltration
  description: The adversary is removing data through an agentic system or connected service.
- id: ATK-TA0040
  name: Impact
  description: The adversary is manipulating, interrupting, or destroying systems, assets, or decisions.
