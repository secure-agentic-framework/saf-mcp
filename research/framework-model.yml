- technique_id: SAF-T1008
  name: Cross-Server Tool Shadowing
  aliases:
  - Tool Shadowing Attack
  lifecycle_status: active
  documentation_status: draft
  evidence_status: demonstrated
  profiles:
  - core
  - mcp
  tactics:
  - ATK-TA0001
  - ATK-TA0004
  summary: 'Tool shadowing is cross-server descriptor interference: text supplied for an attacker-controlled tool
    changes how an agent selects, configures, or invokes a distinct tool from a trusted server. The abused boundary
    is the host''s shared model context, where independently administered tool descriptors are composed without
    an enforceable provenance boundary.'
  technique_path: techniques/SAF-T1008/README.md
  research_packet: research/techniques/SAF-T1008
