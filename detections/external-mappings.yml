# tool_definition_drift: the scan signs one SHA-256 per served tool over the RFC 8785
# canonical bytes of {name, title, description, inputSchema, outputSchema, annotations}
# (scan.toolDigests, keyed tool:<name>) plus scan.toolManifestDigest folded over them. A
# watched target is re-scanned and a changed digest under the same server identity raises a
# 'signed definition changed' alert. Definition-only: an unchanged descriptor over altered
# backend code produces no mismatch. Evidence: the v1 vectors (one named tool) at
# https://github.com/AgentAvow/AgentAvow/tree/main/docs/standards/tool-manifest-digest-vectors-v1
# and the v0 vectors (whole-server manifest digest) at
# https://github.com/AgentAvow/AgentAvow/tree/main/docs/standards/tool-manifest-digest-vectors-v0
# (both: node verify.mjs, zero dependencies, nothing fetched)
- mapping_id: agentavow:tool_definition_drift:SAF-T1201
