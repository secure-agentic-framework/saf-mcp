version: 1
# AgentAvow (provider_id: agentavow) -- static-analysis mappings, all status: candidate.
#
# URL scheme (the same for every row):
#   rule_url      the public scanner module that implements the rule, on the provider
#                 repository's main branch (https://github.com/AgentAvow/AgentAvow)
#   evidence_url  the category's row in the Safety Model v1 spec, section 2 "Detection
#                 categories":
#                 https://github.com/AgentAvow/AgentAvow/blob/main/docs/standards/agentavow-safety-model-v1.md#2-detection-categories
#                 The fragment also carries a text directive (:~:text=) so the link
#                 lands on the category's row; a browser without text-fragment support
#                 lands on the section heading. Rules the spec table does not name
#                 (MCP-native detectors, git autorun) point at the module whose
#                 docstring defines them; the tool-definition-drift rows point at the
#                 signed digest vectors.
#   rule_version  safety-model-v1: the spec version the rule set is published under
#                 (section 10 of the spec).
#
# Relationship: partial unless the rule only fires on a composed multi-step pattern
# (toxic_flow, lethal_trifecta), which is adjacent. Nothing is claimed direct: a static
# rule flags the code, config or declared-schema pattern that enables a technique;
# runtime confirms exploitation.
