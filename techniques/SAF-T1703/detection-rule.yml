title: Cross-Tool Pivot from Untrusted Result to Consequential Action
id: 7c3e428e-1ac0-4c71-b4ba-b21ed3cdf4e1
status: experimental
description: >-
  Detects a causally linked transition from an untrusted or unknown tool result
  to a distinct-server consequential tool call unsupported by user intent and
  lacking valid approval.
author: OpenAI Codex fresh-agent clean-room research
date: 2026-09-02
tags:
  - saf.t1703
logsource:
  category: agent_runtime
  product: normalized_agent_telemetry
fields:
  - trace_id
  - event_id
  - caused_by_event_id
  - event_type
  - timestamp
  - trust_label
  - source_server_id
  - target_server_id
  - user_intent_supported
  - approval_state
  - action_class
detection:
  source_result:
    event_type: tool_result
    trust_label:
      - untrusted
      - unknown
  target_call:
    event_type: tool_call
    user_intent_supported: false
    approval_state:
      - absent
      - bypassed
    action_class:
      - privileged_read
      - external_write
      - code_execution
  correlation:
    same_trace_id: true
    caused_by_event_id_matches_source_event_id: true
    source_server_id_not_equal_target_server_id: true
    max_seconds_inclusive: 300
  condition: source_result followed_by target_call satisfying correlation
falsepositives:
  - Legitimate multi-tool automation where user-intent binding or approval telemetry is missing.
  - Emergency automation that intentionally bypasses approval under a separately audited policy.
level: high
traceability:
  policy: source_or_omit
  design_claim_ids:
    - SAF-T1703-C011
    - SAF-T1703-C015
  telemetry_claim_ids:
    - SAF-T1703-C011
    - SAF-T1703-C012
  limitation_claim_ids:
    - SAF-T1703-C014
    - SAF-T1703-C015
  validation_artifacts:
    - tests/SAF-T1703/test_detection_rule.py
    - tests/SAF-T1703/test-logs.json
    - research/techniques/SAF-T1703/validation/detection-test.txt
    - research/techniques/SAF-T1703/validation/strict-validator.txt
    - research/techniques/SAF-T1703/validation/telemetry-replay/capture-metadata.json
    - research/techniques/SAF-T1703/validation/telemetry-replay/normalized-telemetry.json
    - research/techniques/SAF-T1703/validation/telemetry-replay/server-audit.jsonl
    - research/techniques/SAF-T1703/validation/telemetry-replay/replay-results.txt
    - research/techniques/SAF-T1703/validation/telemetry-replay/verify_replay.py
  components:
    logsource:
      claim_ids: [SAF-T1703-C011]
      rationale: Normalized agent-runtime events are required to reconstruct the cross-tool sequence.
    fields:
      claim_ids: [SAF-T1703-C011, SAF-T1703-C012]
      rationale: Stable trace, causality, identity, intent, approval, and action fields support correlation and tuning.
    source_result:
      claim_ids: [SAF-T1703-C006, SAF-T1703-C011]
      rationale: The analytic begins at an upstream result that can carry adversarial influence.
    target_call:
      claim_ids: [SAF-T1703-C010, SAF-T1703-C011]
      rationale: Consequential unsupported calls are the bounded sink behavior.
    correlation:
      claim_ids: [SAF-T1703-C011, SAF-T1703-C015]
      rationale: Causal linkage, distinct boundaries, and a bounded window reduce coincidence.
    condition:
      claim_ids: [SAF-T1703-C011, SAF-T1703-C015]
      rationale: The condition joins source and sink rather than alerting on either event alone.
    falsepositives:
      claim_ids: [SAF-T1703-C014]
      rationale: Approved or user-supported compound workflows are expected benign matches when context fields are absent.
